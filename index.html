<script>
/* ---------- ответы Мочи: markdown ----------
   Свой разборщик без библиотек: страница работает офлайн и под строгой CSP сервера.
   Умеет: заголовки, абзацы, списки (вложенные, нумерованные, с галочками), цитаты и врезки > [!NOTE],
   таблицы, код с подсветкой, формулы LaTeX ($…$, $$…$$, \(…\), \[…\]), сноски, ссылки-источники [1],
   <details>, <kbd>, ==выделение==, ~~зачёркнутое~~, картинки. Схемы ```mermaid (flowchart, sequence, state,
   pie, mindmap, timeline) и ```dot рисуются пиксельным SVG/HTML.
   Ответ перерисовывается целиком на каждый кусочек потока — всё терпит недописанный текст. */
(()=>{
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl=(n,a,b,c)=>{const k=n%100,j=n%10;return n+' '+(k>10&&k<20?c:j===1?a:j>1&&j<5?b:c)};
const okUrl=u=>!/^[a-z][\w+.-]*:/i.test(u)||/^(https?|mailto|tel):/i.test(u);
const CB='<button class="cp" data-k="c"><i class="pi"></i>копировать</button>';
const cache=new Map();
const memo=(k,f)=>{if(cache.has(k))return cache.get(k);const v=f();if(cache.size>150)cache.delete(cache.keys().next().value);cache.set(k,v);return v};

/* ===== блоки ===== */
const LI=/^( *)([-*+•]|\d{1,9}[.)])[ \t]+(\S.*)$/;
const FENCE=/^ {0,3}(`{3,}|~{3,})[ \t]*([\w+#.-]*)/;
const HR=/^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const HEAD=/^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/;
const DELIM=/^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)*\|?\s*$/;
const ind=l=>l.match(/^ */)[0].length;
const isTable=(lines,i)=>lines[i].includes('|')&&i+1<lines.length&&lines[i+1].includes('|')&&DELIM.test(lines[i+1]);
const starts=(lines,i)=>{const l=lines[i];return FENCE.test(l)||HEAD.test(l)||HR.test(l)||/^ {0,3}>/.test(l)||LI.test(l)||/^\s*(\$\$|\\\[)/.test(l)||/^\s*<details\b[^>]*>/i.test(l)||isTable(lines,i)};

function blocks(lines,ctx,tight){
  let out='',i=0,para=[];
  const flush=()=>{if(!para.length)return;const h=inl(para.join('\n'),ctx);out+=tight?h:'<p>'+h+'</p>';para=[]};
  while(i<lines.length){
    const l=lines[i];let m;
    if(!l.trim()){flush();i++;continue}
    if(m=l.match(FENCE)){
      flush();const f=m[1],sp=ind(l),body=[],close=new RegExp('^ {0,3}'+(f[0]==='`'?'`':'~')+'{'+f.length+',}[ \\t]*$');let closed=false;
      for(i++;i<lines.length;i++){if(close.test(lines[i])){closed=true;i++;break}body.push(sp?lines[i].replace(new RegExp('^ {0,'+sp+'}'),''):lines[i])}
      out+=fence(m[2],body.join('\n'),closed);continue}
    if(m=l.match(/^\s*(\$\$|\\\[)(.*)$/)){
      const c=m[1]==='$$'?'$$':'\\]',k=m[2].indexOf(c);
      if(k>=0&&!m[2].slice(k+2).trim()){flush();out+=mathBlock(m[2].slice(0,k));i++;continue}
      if(k<0){flush();const body=[m[2]];for(i++;i<lines.length;i++){const q=lines[i].indexOf(c);if(q>=0){body.push(lines[i].slice(0,q));i++;break}body.push(lines[i])}
        out+=mathBlock(body.join('\n'));continue}}
    if(m=l.match(HEAD)){flush();const n=m[1].length;out+='<h'+n+'>'+inl(m[2]||'',ctx)+'</h'+n+'>';i++;continue}
    if(HR.test(l)){flush();out+='<hr>';i++;continue}
    if(isTable(lines,i)){
      flush();const head=cells(lines[i]),al=cells(lines[i+1]).map(c=>/^:-+:$/.test(c)?'c':/-:$/.test(c)?'r':'');
      const rows=[];for(i+=2;i<lines.length&&lines[i].trim()&&lines[i].includes('|')&&!FENCE.test(lines[i]);i++)rows.push(cells(lines[i]));
      out+=table(head,al,rows,ctx);continue}
    if(/^ {0,3}>/.test(l)){
      flush();const q=[];for(;i<lines.length&&/^ {0,3}>/.test(lines[i]);i++)q.push(lines[i].replace(/^ {0,3}> ?/,''));
      out+=quote(q,ctx);continue}
    if(/^\s*<details\b[^>]*>/i.test(l)){
      flush();const body=[];let d=0;
      for(;i<lines.length;i++){const x=lines[i];body.push(x);d+=(x.match(/<details\b/gi)||[]).length-(x.match(/<\/details>/gi)||[]).length;if(d<=0){i++;break}}
      let t=body.join('\n');const open=/^\s*<details[^>]*\bopen\b/i.test(t);t=t.replace(/^\s*<details[^>]*>/i,'').replace(/<\/details>\s*$/i,'');
      let sum='Подробнее';t=t.replace(/^\s*<summary>([\s\S]*?)<\/summary>/i,(x,s)=>{sum=s.trim();return ''});
      out+='<details class="xd"'+(open?' open':'')+'><summary>'+inl(sum,ctx)+'</summary><div class="xdb">'+blocks(t.split('\n'),ctx)+'</div></details>';continue}
    if(LI.test(l)){flush();const r=list(lines,i,ctx);out+=r.h;i=r.i;continue}
    para.push(l);i++}
  flush();return out}

function cells(l){
  let s=l.trim();if(s[0]==='|')s=s.slice(1);if(s.endsWith('|')&&!s.endsWith('\\|'))s=s.slice(0,-1);
  const r=[];let cur='',code=false;
  for(let k=0;k<s.length;k++){const c=s[k];
    if(c==='\\'&&s[k+1]==='|'){cur+='|';k++;continue}
    if(c==='`')code=!code;
    if(c==='|'&&!code){r.push(cur.trim());cur=''}else cur+=c}
  r.push(cur.trim());return r}

function table(head,al,rows,ctx){
  const n=head.length;
  /* числа — по правому краю, как в ведомости */
  const num=head.map((_,c)=>!al[c]&&rows.some(r=>(r[c]||'').trim())&&rows.every(r=>{const v=(r[c]||'').replace(/\*\*|[\s\u00a0%₽$€£¥+−~≈×–-]/g,'');return !v||/^\d[\d.,:]*[kKмМ]?$/.test(v)}));
  const A=c=>al[c]==='c'?' class="ac"':al[c]==='r'||num[c]?' class="ar"':'';
  const plain=x=>x.replace(/\*\*|__|`|~~/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
  const tsv=[head,...rows].map(r=>head.map((_,c)=>plain(r[c]||'')).join('\t')).join('\n');
  return '<div class="cb xt"><div class="ch"><span>таблица · '+pl(rows.length,'строка','строки','строк')+'</span><span class="cbb">'+CB+'</span></div>'
    +'<div class="xsc"><table><thead><tr>'+head.map((h,c)=>'<th'+A(c)+'>'+inl(h,ctx)+'</th>').join('')+'</tr></thead><tbody>'
    +rows.map(r=>'<tr>'+head.map((_,c)=>'<td'+A(c)+'>'+inl(r[c]||'',ctx)+'</td>').join('')+'</tr>').join('')
    +'</tbody></table></div><code class="src" hidden>'+E(tsv)+'</code></div>'}

/* цитаты; > [!NOTE] и родня — окошки-врезки */
const CALL={note:'Заметка',info:'Заметка',tip:'Совет',hint:'Совет',success:'Получилось',important:'Важно',warning:'Внимание',caution:'Осторожно',danger:'Осторожно',error:'Ошибка',bug:'Ошибка',question:'Вопрос',example:'Пример',todo:'Сделать',quote:'Цитата',abstract:'Кратко',summary:'Кратко'};
const CK={info:'note',hint:'tip',success:'tip',danger:'caution',error:'caution',bug:'caution',question:'note',example:'note',todo:'important',quote:'note',abstract:'note',summary:'note'};
function quote(q,ctx){
  const m=q[0].match(/^\s*\[!(\w+)\][+-]?[ \t]*(.*)$/);
  if(m&&CALL[m[1].toLowerCase()]){const t=m[1].toLowerCase(),k=CK[t]||t;
    return '<div class="xc xc-'+k+'"><div class="xct"><i></i><span>'+(m[2].trim()?inl(m[2],ctx):CALL[t])+'</span></div><div class="xcb">'+blocks(q.slice(1),ctx)+'</div></div>'}
  return '<blockquote>'+blocks(q,ctx)+'</blockquote>'}

/* списки: прощаем отступы в 2 пробела у вложенных (так пишут почти все модели) */
function list(lines,i,ctx){
  const m0=lines[i].match(LI),base=m0[1].length,ord=/\d/.test(m0[2]),items=[];let loose=false;
  while(i<lines.length){
    const m=lines[i].match(LI);
    if(!m||m[1].length>base+1||/\d/.test(m[2])!==ord)break;
    const co=m[1].length+m[2].length+1,body=[m[3]];let blank=false,ci=0;
    for(i++;i<lines.length;){
      const x=lines[i];
      if(!x.trim()){let j=i+1;while(j<lines.length&&!lines[j].trim())j++;
        if(j<lines.length&&ind(lines[j])>base+1){for(;i<j;i++)body.push('');blank=true;continue}break}
      if(ind(x)>base+1){if(!ci)ci=Math.min(ind(x),co);body.push(x.replace(new RegExp('^ {0,'+ci+'}'),''));i++;continue}
      if(!blank&&!starts(lines,i)){body.push(x.trim());i++;continue}
      break}
    if(blank&&body.slice(1).some(x=>x&&!LI.test(x)))loose=true;
    items.push(body);
    let j=i;while(j<lines.length&&!lines[j].trim())j++;
    if(j>i){const n=lines[j]&&lines[j].match(LI);if(n&&n[1].length<=base+1&&/\d/.test(n[2])===ord){loose=true;i=j;continue}break}}
  const tag=ord?'ol':'ul',st=ord?parseInt(m0[2]):1;
  return {i,h:'<'+tag+(st!==1?' start="'+st+'"':'')+'>'+items.map(b=>{
    const t=b[0].match(/^\[([ xX])\][ \t]+(.*)$/);let cls='';
    if(t){b=[t[2],...b.slice(1)];cls=' class="xk'+(t[1]===' '?'':' on')+'"'}
    return '<li'+cls+'>'+(t?'<i></i>':'')+blocks(b,ctx,!loose)+'</li>'}).join('')+'</'+tag+'>'}}

/* ===== строки ===== */
const IMG=/!\[([^\]\n]*)\]\(\s*<?([^\s)>]+)>?(?:\s+(?:"[^"]*"|'[^']*'))?\s*\)/g;
const LINK=/\[((?:[^\[\]\n]|\[[^\]\n]*\])+)\]\(\s*<?([^\s()<>]+(?:\([^\s()]*\)[^\s()<>]*)*)>?(?:\s+(?:"[^"]*"|'[^']*'))?\s*\)/g;
const a=(u,t,c)=>'<a href="'+E(u)+'" target="_blank" rel="noopener noreferrer"'+(c?' class="'+c+'"':'')+'>'+t+'</a>';
function inl(s,ctx){
  const keep=[],K=h=>'\u0000'+(keep.push(h)-1)+'\u0000';
  s=String(s).replace(/\u0000/g,'')
    .replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g,(m,b,c)=>K('<code>'+E(c.replace(/^ ([\s\S]*) $/,'$1'))+'</code>'))
    .replace(/\\\[([\s\S]+?)\\\]|\$\$([\s\S]+?)\$\$/g,(m,x,y)=>K(math(x||y,1)))
    .replace(/\\\(([\s\S]+?)\\\)/g,(m,x)=>K(math(x,0)))
    .replace(/(^|[^\\$\w])\$([^\s$](?:[^$\n]*?[^\s$\\])?)\$(?![\w$])/g,(m,p,x)=>p+K(math(x,0)))
    .replace(/\\([!-\/:-@\[-`{-~])/g,(m,c)=>K(E(c)))
    .replace(/<((?:https?|mailto):[^\s<>]+)>/gi,(m,u)=>K(a(u,E(u))))
    .replace(IMG,(m,t,u)=>!(okUrl(u)||/^data:image\//i.test(u))?m:K(badImg.has(u)?a(u,E(t||u),'xil'):'<img class="xi" src="'+E(u)+'" alt="'+E(t)+'" loading="lazy">'))
    .replace(LINK,(m,t,u)=>okUrl(u)?K(a(u,emph(E(t)))):m)
    .replace(/\[\^([^\]\s]+)\]/g,(m,id)=>{if(!ctx.fn.has(id))return m;let n=ctx.fo.indexOf(id)+1;if(!n)n=ctx.fo.push(id);return K('<sup class="xfn">'+n+'</sup>')})
    .replace(/\[([^\[\]\n]+)\](?:\[([^\]\n]*)\])?/g,(m,t,r)=>{const u=ctx.refs.size&&ctx.refs.get((r||t).toLowerCase());if(!u)return m;return K(/^\d+$/.test(t)?a(u,E(t),'xci'):a(u,emph(E(t))))})
    .replace(/\b(?:https?:\/\/|www\.)[^\s<>"'\u0000]+/gi,u=>{let t='';
      for(;;){const c=u.slice(-1);if(/[.,!?:;»”'"*_]/.test(c)||(c===')'&&(u.match(/\(/g)||[]).length<(u.match(/\)/g)||[]).length)){t=c+t;u=u.slice(0,-1)}else break}
      return K(a(/^www\./i.test(u)?'https://'+u:u,E(u)))+t});
  s=E(s).replace(/&lt;br\s*\/?&gt;/gi,'<br>')
    .replace(/&lt;(kbd|sub|sup|u|mark|s|del|ins|b|i|strong|em|small)&gt;([\s\S]*?)&lt;\/\1&gt;/gi,(m,t,c)=>{t=t.toLowerCase();return '<'+t+'>'+c+'</'+t+'>'})
    .replace(/&lt;!--[\s\S]*?--&gt;/g,'');
  s=emph(s).replace(/\n/g,'<br>');
  for(let k=0;k<4&&s.includes('\u0000');k++)s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>keep[i]);
  return s}
const W='\\w\\u00C0-\\u024F\\u0400-\\u04FF';
const R_B3=/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g,R_B=/\*\*(?=\S)([\s\S]*?\S)\*\*/g,R_U2=new RegExp('(^|[^'+W+'])__(?=\\S)([\\s\\S]*?\\S)__(?!['+W+'])','g'),
  R_I=new RegExp('(^|[^*'+W+'])\\*(?=[^\\s*])([\\s\\S]*?[^\\s*])\\*(?![*'+W+'])','g'),R_U=new RegExp('(^|[^'+W+'])_(?=[^\\s_])([\\s\\S]*?[^\\s_])_(?!['+W+'])','g');
const emph=s=>s.replace(R_B3,'<b><em>$1</em></b>').replace(R_B,'<b>$1</b>').replace(R_U2,'$1<b>$2</b>').replace(R_I,'$1<em>$2</em>').replace(R_U,'$1<em>$2</em>')
  .replace(/~~(?=\S)([\s\S]*?\S)~~/g,'<del>$1</del>').replace(/==(?=[^\s=])([^=\n]*?[^\s=])==/g,'<mark>$1</mark>');

/* ===== код ===== */
function fence(lang,code,closed){
  const l=lang.toLowerCase();
  if(!closed)return /^(mermaid|mmd|dot|graphviz)$/.test(l)?codeBox('схема · рисую…',code,''):codeBox(lang,code,l);
  return memo(l+'\u0001'+code,()=>{
    if(/^(mermaid|mmd)$/.test(l)){const d=mermaid(code);return d?dgBox(d[0],d[1],code):codeBox('mermaid',code,'')}
    if(/^(dot|graphviz)$/.test(l)){const d=diagram(()=>graph(dotParse(code)));return d?dgBox('схема',d,code):codeBox(lang,code,'')}
    if(/^(math|tex-math)$/.test(l))return mathBlock(code);
    return codeBox(lang,code,l)})}
const codeBox=(lang,code,l)=>{const one=code&&!code.includes('\n');
  return '<div class="cb"><div class="ch"><span>'+E(lang||'код')+'</span><span class="cbb">'+(one?'<button class="cp" data-k="t" title="Вставить в терминал"><i class="pi"></i>в терминал</button>':'')+CB+'</span></div><pre><code>'+hl(code,l)+'</code></pre></div>'};
const dgBox=(kind,body,src)=>'<div class="cb xg"><div class="ch"><span>'+kind+'</span><span class="cbb"><button class="cp" data-k="v"><i class="pi"></i>код</button>'+CB+'</span></div><div class="xgb">'+body+'</div><pre class="xgs"><code class="src">'+E(src)+'</code></pre></div>';

/* подсветка: комментарии, строки, числа, ключевые слова — цветами старого монитора */
const R=String.raw,DQ=R`"(?:[^"\\\n]|\\.)*"`,SQ=R`'(?:[^'\\\n]|\\.)*'`,BT=R`\x60(?:[^\x60\\]|\\.)*\x60`,EOF=R`(?![\s\S])`,
  CC=R`//[^\n]*|/\*[\s\S]*?(?:\*/|${EOF})`,HC=R`(?:^|[ \t])#[^\n]*`;
const KW={
  c:'auto break case char const continue default do double else enum extern float for goto if inline int long register return short signed sizeof static struct switch typedef union unsigned void volatile while class public private protected virtual template typename namespace using new delete this throw try catch operator friend bool true false nullptr NULL override final constexpr noexcept std string vector',
  js:'var let const function return if else for while do switch case default break continue new delete typeof instanceof in of class extends super this import export from as async await yield try catch finally throw null undefined true false void static get set interface type enum implements readonly declare keyof namespace abstract private public protected console require module',
  java:'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws try void volatile while true false null var val fun when object companion data sealed open override lateinit is in suspend String',
  cs:'abstract as base bool break byte case catch char class const continue decimal default delegate do double else enum event explicit extern false finally float for foreach if implicit in int interface internal is lock long namespace new null object operator out override params private protected public readonly ref return sealed short static string struct switch this throw true try typeof uint ulong using virtual void while var async await get set yield record',
  py:'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield self match case print len range',
  sh:'if then else elif fi for while until do done case esac in function return exit local export readonly declare unset shift source alias echo cd sudo set trap printf read eval exec',
  go:'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false iota make len append string int error',
  rs:'as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while Some None Ok Err String Vec Option Result',
  sql:'select from where and or not insert into values update set delete create table drop alter add index on join left right inner outer full cross group by order having limit offset as distinct union all null is in like between case when then else end primary key foreign references default exists count sum avg min max asc desc view with returning if begin commit rollback',
  php:'abstract and array as break case catch class clone const continue declare default do echo else elseif empty endif extends final finally fn for foreach function global if implements include isset list namespace new null or print private protected public require return static switch this throw trait true false try unset use var while yield',
  rb:'alias and begin break case class def defined do else elsif end ensure false for if in module next nil not or redo rescue retry return self super then true undef unless until when while yield require puts attr_accessor',
  lua:'and break do else elseif end false for function goto if in local nil not or repeat return then true until while',
  swift:'as break case catch class continue default defer do else enum extension false for func guard if import in init inout internal is let nil private protocol public return self static struct super switch throw throws true try var where while async await',
  yaml:'true false null yes no on off',

  const g=Array.from({length:GH},()=>Array(GW).fill(''));
  src.forEach((r,y)=>{for(let x=0;x<GW;x++)if(r[x]!=='.')g[y][x]=r[x]});
  for(const n of gl){const G=FXG[n];if(!G)continue;let[x0,y0,rows]=G;
    const em=n!=='lock'&&n!=='link'&&n!=='broken';
    if(b==='dir'&&em)y0=Math.max(y0+(n==='img'||n==='code'?1:0),8);

  const at=(x,y)=>y>=0&&y<GH&&x>=0&&x<GW?g[y][x]:'';

  for(let y=0;y<GH;y++){let x=0;while(x<GW){const c=g[y][x];if(!c){x++;continue}let w=1;while(x+w<GW&&g[y][x+w]===c)w++;add(c,x,y,w);x+=w}}

const ferr=(msg,code)=>Object.assign(new Error(msg),{code});
const SRVB={
  async req(u,o={}){
    let r;
    try{r=await fetch(u,{method:o.method||'GET',headers:{...(o.json!==undefined?{'content-type':'application/json'}:{}),...(o.method&&o.method!=='GET'?{'x-mochi':'1'}:{}),...o.headers},

    catch(e){if(e.name==='AbortError')throw e;throw ferr('нет связи с сервером','NET')}
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok)throw ferr((j&&j.error)||'ошибка сервера: HTTP '+r.status,(j&&j.code)||(r.status===401?'AUTH':'HTTP'+r.status));
    return j},
  q:p=>'?path='+encodeURIComponent(p),
  info(){return this.req('api/fs/info')},
  list(p){return this.req('api/fs/list'+this.q(p))},
  stat(p){return this.req('api/fs/stat'+this.q(p))},
  search(p,q,hidden,signal){return this.req('api/fs/search'+this.q(p)+'&q='+encodeURIComponent(q)+(hidden?'&hidden=1':''),{signal})},
  du(p,signal){return this.req('api/fs/du'+this.q(p),{signal})},
  archive(p){return this.req('api/fs/archive'+this.q(p))},
  op(fop,a){return this.req('api/fs/op',{method:'POST',json:{fop,...a}})},
  url(p){return 'api/fs/raw'+this.q(p)},
  dl(p,dir){return dir?'api/fs/tar'+this.q(p):'api/fs/raw'+this.q(p)+'&dl=1'},
  /* кусок файла: {buf, size} */
  async bytes(p,start,end,signal){
    let r;
    try{r=await fetch(this.url(p),{headers:{range:'bytes='+start+'-'+end},credentials:'same-origin',cache:'no-store',signal})}catch(e){if(e.name==='AbortError')throw e;throw ferr('нет связи с сервером','NET')}
    if(!r.ok&&r.status!==206){let j=null;try{j=await r.json()}catch(e){}if(r.status===416)return{buf:new Uint8Array(0),size:0};throw ferr((j&&j.error)||'HTTP '+r.status,j&&j.code)}

  upload(dir,file,name,over,onp){
    const x=new XMLHttpRequest();
    const p=new Promise((ok,no)=>{
      x.open('PUT','api/fs/upload?dir='+encodeURIComponent(dir)+'&name='+encodeURIComponent(name)+(over?'&over=1':''));
      x.setRequestHeader('x-mochi','1');x.setRequestHeader('content-type','application/octet-stream');

      x.onerror=()=>no(ferr('нет связи с сервером','NET'));x.onabort=()=>no(ferr('отменено','ABORT'));

    p.abort=()=>x.abort();return p}
};

const cols=()=>{if(FX.view==='ls')return 1;const els=list.children;if(!els.length||!els[0].dataset.p)return 1;const t=els[0].offsetTop;let n=0;for(const el of els){if(el.offsetTop!==t)break;n++}return Math.max(1,n)};
function moveCur(d,ext){
  if(!order.length)return;
  let i=order.findIndex(e=>e.path===FX.cur);
  if(i<0)i=d>0?-1:order.length;
  const j=Math.max(0,Math.min(order.length-1,d===Infinity?order.length-1:d===-Infinity?0:i+d)),p=order[j].path;
  if(ext)range(p);else select([p],p,p);
  elOf(p)?.scrollIntoView({block:'nearest'})}
document.addEventListener('keydown',ev=>{
  if(!isOn()||ev.defaultPrevented)return;
  if($('#dlg').open||$('#ask').open||document.querySelector('#auth[open]'))return;
  if(FXV.isOpen())return FXV.key(ev);
  if(!dlg.hidden){if(ev.key==='Escape'){ev.preventDefault();closeDlg()}return}
  if(!menuEl.hidden)return menuKey(ev);
  const t=ev.target,inField=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  const k=ev.key,mod=ev.ctrlKey||ev.metaKey;
  if(mod&&k.toLowerCase()==='f'&&!ev.shiftKey){ev.preventDefault();openFind();return}
  if(inField){if(k==='Escape'&&t===findIn){ev.preventDefault();closeFind()}if(k==='Escape'&&t===pin){ev.preventDefault();pathEdit(false)}return}
  if(t&&t.closest&&t.closest('nav,.fx-act,.fx-tb,.fx-pb,.fx-side')&&(k==='Enter'||k===' '))return;
  const one=selItems(),cur=FX.cur&&byPath.get(FX.cur);
  let h=true;
  switch(true){
    case k==='ArrowRight'&&ev.altKey:goFwd();break;
    case k==='ArrowLeft'&&ev.altKey:goBack();break;
    case k==='ArrowUp'&&ev.altKey:case k==='Backspace':goUp();break;
    case k==='ArrowDown'&&ev.altKey:if(cur)activate(cur,elOf(cur.path));break;
    case k==='ArrowRight':moveCur(1,ev.shiftKey);break;
    case k==='ArrowLeft':moveCur(-1,ev.shiftKey);break;
    case k==='ArrowDown':moveCur(cols(),ev.shiftKey);break;
    case k==='ArrowUp':moveCur(-cols(),ev.shiftKey);break;
    case k==='Home':moveCur(-Infinity,ev.shiftKey);break;
    case k==='End':moveCur(Infinity,ev.shiftKey);break;
    case k==='PageDown':moveCur(cols()*5,ev.shiftKey);break;
    case k==='PageUp':moveCur(-cols()*5,ev.shiftKey);break;
    case k==='Enter'&&(ev.altKey||mod):if(one.length)props(one[0]);break;
    case k==='Enter':if(cur||one.length)activate(cur||one[0],elOf((cur||one[0]).path));break;
    case k===' ':if(cur&&!isDir(cur))FXV.open(cur,elOf(cur.path));else if(cur)activate(cur,elOf(cur.path));break;
    case k==='Delete':if(one.length)del(one);break;
    case k==='F2':if(one.length===1)startRename(one[0]);break;
    case k==='F5':refresh(false);break;
    case k==='ContextMenu'||ev.shiftKey&&k==='F10':{const el=FX.cur&&elOf(FX.cur);if(el&&!FX.sel.has(FX.cur))select([FX.cur],FX.cur,FX.cur);
      const r=(el||main).getBoundingClientRect();openMenu(el?itemMenu():bgMenu(),{x:r.left+r.width/2,y:r.top+(el?r.height/2:20),kb:true});break}
    case k==='Escape':if(FX.search||FX.filter)closeFind();else clearSel();break;
    case mod&&k.toLowerCase()==='a':select(order.map(e=>e.path));break;
    case mod&&k.toLowerCase()==='c'&&!ev.shiftKey:if(one.length)clip('copy',one);break;
    case mod&&k.toLowerCase()==='x':if(one.length)clip('cut',one);break;
    case mod&&k.toLowerCase()==='v':paste(FX.path);break;
    case mod&&k.toLowerCase()==='d':if(one.length)dup(one);break;
    case mod&&k.toLowerCase()==='i':if(one.length)props(one[0]);else props(dirEntry());break;
    case mod&&ev.shiftKey&&k.toLowerCase()==='n':newDir();break;
    case k.length===1&&!mod&&!ev.altKey&&/\S/.test(k):{const n=Date.now();if(n-ta.t>900)ta.s='';ta.t=n;ta.s+=k.toLowerCase();
      const e=order.find(x=>x.n.toLowerCase().startsWith(ta.s))||order.find(x=>x.n.toLowerCase().startsWith(k.toLowerCase()));
      if(e){select([e.path],e.path,e.path);elOf(e.path)?.scrollIntoView({block:'nearest'})}break}
    default:h=false}
  if(h)ev.preventDefault()});

act.addEventListener('click',ev=>{const b=ev.target.closest('[data-x]');if(!b)return;const s=selItems(),a=b.dataset.x;

  else{x=at.x-R.left;y=at.y-R.top;if(x+mw>R.width-8)x=x-mw;if(y+mh>R.height-8)y=Math.max(8,y-mh)}

function menuKey(ev){

  else if(ev.key==='ArrowUp'){ev.preventDefault();bs[(i-1+bs.length)%bs.length]?.focus()}
  else if(ev.key==='Home'){ev.preventDefault();bs[0]?.focus()}else if(ev.key==='End'){ev.preventDefault();bs[bs.length-1]?.focus()}}

/* поиск: набор — сразу отбор в этой папке; Enter — вглубь по всем вложенным */
let findAc=null;
function openFind(){findBar.hidden=false;btn('find').classList.add('on');findIn.focus();findIn.select()}
function closeFind(){findBar.hidden=true;btn('find').classList.remove('on');findAc&&findAc.abort();const was=FX.search;FX.filter='';findIn.value='';FX.search=null;if(was)go(was.base,{push:false,pop:false});else render();if(fine.matches)main.focus({preventScroll:true})}
findIn.addEventListener('input',()=>{if(FX.search)return;FX.filter=findIn.value.trim();render()});
findIn.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();deep()}});
btn('deep').onclick=deep;btn('findx').onclick=closeFind;
async function deep(){
  const qv=findIn.value.trim();if(!qv)return;
  const from=FX.search?FX.search.base:FX.path;findAc&&findAc.abort();findAc=new AbortController();
  FX.busy++;setBusy();
  try{const r=await B.search(from,qv,FX.hidden,findAc.signal);
    FX.search={q:qv,base:from,partial:r.partial};FX.filter='';FX.items=r.entries.map(e=>prep(e,from));FX.sel.clear();FX.cur=null;FX.err=null;
    chrome();render({pop:true});pet('look',r.entries.length?'Нашла: '+r.entries.length+'!':'Ничего не нашла…',2500)}
  catch(e){if(e.name!=='AbortError')toast(errMsg(e),'err')}
  finally{FX.busy--;setBusy()}}
async function reveal(p){closeFindQuiet();const ok=await go(parent(p),{pop:false});if(ok){const el=elOf(p);if(el){select([p],p,p);el.scrollIntoView({block:'center'});el.classList.add('blink');setTimeout(()=>el.classList.remove('blink'),1600)}}}
function closeFindQuiet(){findBar.hidden=true;btn('find').classList.remove('on');FX.search=null;FX.filter='';findIn.value=''}

/* ---------- действия ---------- */
async function run(fn,okMsg){FX.busy++;setBusy();try{const r=await fn();if(okMsg)toast(okMsg);return r}catch(e){toast(errMsg(e),'err');return null}finally{FX.busy--;setBusy()}}
const report=(r,what)=>{if(!r)return;const n=(r.done||[]).length,e=r.errors||[];
  if(e.length)toast((n?what+': '+n+'. ':'')+'Не вышло: '+e.slice(0,2).map(x=>x.err).join('; ')+(e.length>2?' и ещё '+(e.length-2):''),'err');else if(n)toast(what+': '+n)};
function clip(mode,s){FX.clip={mode,paths:s.map(e=>e.path),from:FX.path};render();toast((mode==='cut'?'Вырезано: ':'Скопировано: ')+s.length+' — открой папку и нажми «Вставить»')}
async function paste(dest){
  if(!FX.clip||!dest)return;
  const c=FX.clip,r=await run(()=>B.op(c.mode==='cut'?'move':'copy',{paths:c.paths,dest}));
  if(!r)return;report(r,c.mode==='cut'?'Перенесено':'Скопировано');
  if(c.mode==='cut'&&!(r.errors||[]).length)FX.clip=null;
  sfxp('file');await refresh(false);
  const got=(r.done||[]).map(x=>x.path).filter(p=>byPath.has(p));if(got.length)select(got,got[got.length-1],got[0])}
async function dup(s){const r=await run(()=>B.op('copy',{paths:s.map(e=>e.path),dest:FX.path}));if(!r)return;report(r,'Дублировано');await refresh(false);const got=(r.done||[]).map(x=>x.path);if(got.length)select(got,got[0],got[0])}
async function del(s){
  if(!s.length)return;
  const ok=await ask('Удалить',(s.length===1?'«'+s[0].n+'»':objs(s.length))+(s.some(isDir)?' (вместе со всем, что внутри)':'')+' — удалить навсегда? Корзины нет, вернуть не получится.',null,'Удалить');
  if(!ok)return;
  s.forEach(e=>elOf(e.path)?.classList.add('gone'));sfxp('err');
  const r=await run(()=>B.op('delete',{paths:s.map(e=>e.path)}));
  await sleep(RM.matches?0:380);
  if(r){report(r,'Удалено');if((r.done||[]).length)pet('wave',s.length>1?'Пока-пока, файлики!':'Пока-пока, «'+s[0].n.slice(0,24)+'»!',2500)}
  if(FX.clip)FX.clip.paths=FX.clip.paths.filter(p=>!s.some(e=>e.path===p));
  FX.sel.clear();await refresh(false)}
function uniq(n){const have=new Set(FX.items.map(e=>e.n));if(!have.has(n))return n;const i=n.lastIndexOf('.'),[b,x]=i>0?[n.slice(0,i),n.slice(i)]:[n,''];for(let k=2;;k++){const c=b+' '+k+x;if(!have.has(c))return c}}
async function newDir(){if(!FX.path||FX.search||FX.err)return;const n=uniq('Новая папка');const r=await run(()=>B.op('mkdir',{path:FX.path,name:n}));if(!r)return;sfxp('tick');await refresh(false);const e=byPath.get(r.path);if(e){select([e.path],e.path,e.path);startRename(e)}}
async function newFile(){if(!FX.path||FX.search||FX.err)return;const n=uniq('Новый файл.txt');const r=await run(()=>B.op('newfile',{path:FX.path,name:n}));if(!r)return;await refresh(false);const e=byPath.get(r.path);if(e){select([e.path],e.path,e.path);startRename(e)}}
async function extract(e){
  const r=await run(()=>B.op('extract',{path:e.path}));if(!r)return;
  FXV.isOpen()&&await FXV.close();
  toast('Распаковано в «'+r.name+'»'+(r.skipped?' · пропущено '+r.skipped+' (пути с «..», ссылки, шифрование)':''));sfxp('file');pet('happy','Распаковала!',2000);
  if(parent(r.path)===FX.path){await refresh(false);const el=elOf(r.path);if(el){select([r.path],r.path,r.path);el.scrollIntoView({block:'nearest'});el.classList.add('blink');setTimeout(()=>el.classList.remove('blink'),1600)}}}
async function pack(s){
  const r=await run(()=>B.op('pack',{paths:s.map(e=>e.path)}));if(!r)return;
  toast('Сжато в «'+r.name+'»');sfxp('file');
  if(parent(r.path)===FX.path){await refresh(false);select([r.path],r.path,r.path)}}
async function download(s){
  const go1=async(e,k)=>{let u;try{u=await B.dl(e.path,isDir(e))}catch(x){toast(errMsg(x),'err');return}
    const a=document.createElement('a');a.href=u;a.download=isDir(e)?e.n+'.tar.gz':e.n;a.rel='noopener';document.body.append(a);a.click();a.remove()};

async function enqueue(files,dir){

  let over=false;
  if(dir===FX.path){const have=new Set(FX.items.map(e=>e.n)),clash=files.filter(f=>!f.rel.includes('/')&&have.has(f.file.name));
    if(clash.length){const a=await choose('Такие файлы уже есть',(clash.length===1?'«'+clash[0].file.name+'»':objs(clash.length)+': '+clash.slice(0,3).map(f=>'«'+f.file.name+'»').join(', ')+(clash.length>3?'…':''))+' — что сделать?',[['skip','Отмена'],['keep','Оставить оба'],['over','Заменить',1]]);

/* клавиши, пока открыт просмотр */
function key(ev){
  if(!S)return;
  const k=ev.key,mod=ev.ctrlKey||ev.metaKey,t=ev.target,field=t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT');
  if(k==='Escape'){ev.preventDefault();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(!dlg.hidden)closeDlg();else close();return}
  if(!dlg.hidden)return;
  if(mod&&k.toLowerCase()==='s'){ev.preventDefault();S.save&&S.save();return}
  if(field)return;
  if(ev.altKey&&(k==='ArrowLeft'||k==='ArrowRight')){ev.preventDefault();nav(k==='ArrowLeft'?-1:1);return}
  const m=S.media&&S.media.m;
  if(S.mode==='img'&&S.img){
    if(k==='ArrowLeft'||k==='ArrowRight'){ev.preventDefault();nav(k==='ArrowLeft'?-1:1)}
    else if(k==='+'||k==='='){ev.preventDefault();S.img.zoomAt(1.25)}else if(k==='-'){ev.preventDefault();S.img.zoomAt(1/1.25)}
    else if(k==='0'){ev.preventDefault();S.img.setFit()}else if(k==='1'){ev.preventDefault();S.img.one()}return}
  if(m){
    if(k===' '||k.toLowerCase()==='k'){if(t&&t.closest&&t.closest('button'))return;ev.preventDefault();S.media.toggle()}
    else if(k==='ArrowLeft'||k==='ArrowRight'){ev.preventDefault();m.currentTime+=(k==='ArrowLeft'?-1:1)*(ev.shiftKey?30:5)}
    else if(k.toLowerCase()==='j'||k.toLowerCase()==='l'){ev.preventDefault();m.currentTime+=k.toLowerCase()==='j'?-10:10}
    else if(k==='ArrowUp'||k==='ArrowDown'){ev.preventDefault();m.volume=Math.max(0,Math.min(1,m.volume+(k==='ArrowUp'?.1:-.1)));m.muted=false;cfg.fxvol=m.volume;save()}
    else if(k.toLowerCase()==='m'){ev.preventDefault();m.muted=!m.muted}
    else if(k.toLowerCase()==='f'){ev.preventDefault();S.media.full()}
    else if(/^[0-9]$/.test(k)&&m.duration){ev.preventDefault();m.currentTime=m.duration*(+k)/10}
    else if(k.toLowerCase()==='n'){ev.preventDefault();nav(1)}else if(k.toLowerCase()==='p'){ev.preventDefault();nav(-1)}}}
/* ушли на другую вкладку — видео на паузу (музыка пусть играет, как у плеера) */

  upShow()}
navBtn&&navBtn.addEventListener('click',show);
document.querySelectorAll('nav [data-v]').forEach(b=>{if(b.dataset.v!=='files')b.addEventListener('click',()=>FXV.pauseVideo())});
/* агент мог что-то создать или поменять — пока вкладка открыта, папка обновляется сама */
setInterval(()=>{if(isOn()&&!document.hidden&&FX.inited&&!FX.busy&&!renaming&&menuEl.hidden&&dlg.hidden&&!dragging&&!band&&!FXV.isOpen())refresh(true)},4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&isOn()&&FX.inited)refresh(true)});
addEventListener('beforeunload',ev=>{if(FXV.dirty){ev.preventDefault();ev.returnValue=''}});
chrome();
})();
</script>
