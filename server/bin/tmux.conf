# Мочи: tmux в терминале браузера. Цвета — именованные ANSI: их палитру задаёт тема Мочи,
# поэтому строка состояния светится тем же люминофором, что и весь экран (и меняется вместе с темой).
# Свои настройки — в ~/.tmux.conf, он подключается в конце.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -g status-style "bg=default,fg=green"
set -g status-left "[мочи] "
set -g status-left-style "fg=magenta"
set -g status-right "%H:%M"
set -g status-right-style "fg=brightblack"
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=brightgreen,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
set -g message-style "bg=default,fg=yellow"
set -g mode-style "bg=green,fg=black"
if-shell "test -f ~/.tmux.conf" "source-file ~/.tmux.conf"
